# Applied at nginx http context via /etc/nginx/conf.d.
# Long-running GEE analyses (carbon, multi-index vegetation, LULC) can exceed
# nginx's 60s proxy default even when the backend is still computing normally.
proxy_connect_timeout 15s;
proxy_send_timeout 650s;
proxy_read_timeout 650s;
send_timeout 650s;
client_body_timeout 650s;
