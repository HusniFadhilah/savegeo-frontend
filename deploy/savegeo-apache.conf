# The LEN public reverse proxy uses port 5500 for the SAVEGEO frontend.
Listen 5500

<VirtualHost *:80 *:5500>
    ServerName savegeo.len.co.id
    ServerAlias begeo.len.co.id

    DocumentRoot /home/ubuntu/savegeo/frontend/dist

    ProxyPreserveHost On
    Timeout 650
    ProxyTimeout 650
    ProxyPass /api/ http://127.0.0.1:8086/api/ connectiontimeout=15 timeout=650 retry=0
    ProxyPassReverse /api/ http://127.0.0.1:8086/api/
    ProxyPass /disaster-thumbnails/ http://127.0.0.1:8086/disaster-thumbnails/ connectiontimeout=15 timeout=650 retry=0
    ProxyPassReverse /disaster-thumbnails/ http://127.0.0.1:8086/disaster-thumbnails/

    <Directory /home/ubuntu/savegeo/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html

        # Browser hardening for the SPA only. Proxied /api responses keep the
        # stricter headers set by the backend, so these live in the static
        # document-root section rather than at virtual-host level.
        Header always set X-Frame-Options "DENY"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(self)"
        Header always set Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
        # Candidate script policy, observed before enforcement. The print-preview
        # window still uses inline onclick handlers and must move to listeners
        # before this can be enforced.
        Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' data: blob: https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    </Directory>

    # Vite assets are content-hashed. A stale HTML document may still request
    # an older hash after a deploy; never turn a missing CSS/JS file into the
    # SPA HTML document, because nosniff then rejects it as the wrong MIME type.
    <Directory /home/ubuntu/savegeo/frontend/dist/assets>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource disabled
    </Directory>

    <Files "index.html">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    </Files>
    <FilesMatch "\.(?:css|js|mjs|map|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp)$">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin"
    # Browsers honour HSTS only over HTTPS, i.e. via the TLS-terminating LEN proxy.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    <Location "/api/">
        Header always set Referrer-Policy "no-referrer"
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/savegeo-error.log
    CustomLog ${APACHE_LOG_DIR}/savegeo-access.log combined
</VirtualHost>
