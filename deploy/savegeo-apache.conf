# The LEN public reverse proxy uses port 5500 for the SAVEGEO frontend.
Listen 5500

<VirtualHost *:80 *:5500>
    ServerName savegeo.len.co.id

    DocumentRoot /home/ubuntu/savegeo/frontend/dist

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8086/api/
    ProxyPassReverse /api/ http://127.0.0.1:8086/api/

    <Directory /home/ubuntu/savegeo/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/savegeo-error.log
    CustomLog ${APACHE_LOG_DIR}/savegeo-access.log combined
</VirtualHost>
