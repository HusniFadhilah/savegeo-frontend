name: Validate SAVEGEO frontend

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install, lint, test, audit, and build
        env:
          VITE_API_BASE_URL: /api
          VITE_APP_ENV: test
        run: |
          npm ci
          npm run lint
          npm test
          npm audit --audit-level=high
          npm run build

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree for secrets
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source /repo \
            --no-git \
            --redact \
            --exit-code 1
