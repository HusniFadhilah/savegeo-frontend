name: Validate SAVEGEO frontend

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install, lint, test, audit, and build
        env:
          VITE_API_BASE_URL: /api
          VITE_APP_ENV: test
        run: |
          npm ci
          npm run lint
          npm test
          npm audit --audit-level=high
          npm run build

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree for secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
        run: |
          set -euo pipefail
          pulled=false
          for attempt in 1 2 3 4 5; do
            if docker pull "$GITLEAKS_IMAGE"; then
              pulled=true
              break
            fi
            echo "Gitleaks image pull failed (attempt $attempt/5); retrying..." >&2
            sleep $((attempt * 10))
          done
          if [ "$pulled" != true ]; then
            echo "Unable to pull $GITLEAKS_IMAGE after 5 attempts." >&2
            exit 1
          fi
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            "$GITLEAKS_IMAGE" detect \
            --source /repo \
            --no-git \
            --redact \
            --exit-code 1
