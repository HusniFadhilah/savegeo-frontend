name: Build and deploy SAVEGEO frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: savegeo-frontend-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      build_artifact_outcome: ${{ steps.build_artifact.outcome }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install, lint, test, audit, and build
        env:
          VITE_API_BASE_URL: /api
          VITE_APP_ENV: production
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          SAVEGEO_DEPLOYMENT_ENVIRONMENT: production
        run: |
          npm ci
          npm run lint
          npm test
          npm audit --audit-level=high
          npm run build
          node scripts/validate-build-metadata.mjs dist/build-metadata.json --expected-environment production

      - name: Upload production build
        id: build_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: savegeo-frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [validate, gitleaks]
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      FRONTEND_REMOTE_DIR: ${{ secrets.FRONTEND_REMOTE_DIR }}
      FRONTEND_APACHE_SITE_PATH: ${{ secrets.FRONTEND_APACHE_SITE_PATH }}
      FRONTEND_NGINX_TIMEOUTS_PATH: ${{ secrets.FRONTEND_NGINX_TIMEOUTS_PATH }}
      FRONTEND_HEALTH_URL: ${{ secrets.FRONTEND_HEALTH_URL }}
      FRONTEND_CURL_RESOLVE: ${{ secrets.FRONTEND_CURL_RESOLVE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for artifact validation
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download production build
        if: needs.validate.outputs.build_artifact_outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          name: savegeo-frontend-dist
          path: dist/

      - name: Rebuild validated source when artifact storage is unavailable
        if: needs.validate.outputs.build_artifact_outcome == 'failure'
        env:
          VITE_API_BASE_URL: /api
          VITE_APP_ENV: production
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          SAVEGEO_DEPLOYMENT_ENVIRONMENT: production
        run: |
          echo '::warning::Build artifact upload failed; rebuilding this validated commit with the lockfile and production configuration.'
          npm ci
          npm run build

      - name: Validate deployed artifact provenance
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/validate-build-metadata.mjs dist/build-metadata.json --expected-sha "$GITHUB_SHA" --expected-environment production

      - name: Install VPN and deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn sshpass rsync netcat-openbsd

      - name: Connect VPN
        env:
          VPN_CONFIG_B64: ${{ secrets.VPN_CONFIG_B64 }}
          VPN_AUTH_B64: ${{ secrets.VPN_AUTH_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$VPN_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/client.ovpn"
          printf '%s' "$VPN_AUTH_B64" | base64 --decode > "$RUNNER_TEMP/vpn-auth.txt"
          chmod 600 "$RUNNER_TEMP/client.ovpn" "$RUNNER_TEMP/vpn-auth.txt"
          sudo openvpn --config "$RUNNER_TEMP/client.ovpn" \
            --auth-user-pass "$RUNNER_TEMP/vpn-auth.txt" \
            --daemon --log "$RUNNER_TEMP/openvpn.log"
          for i in $(seq 1 30); do
            nc -z -w 3 "$DEPLOY_HOST" "$DEPLOY_SSH_PORT" && exit 0
            sleep 3
          done
          sudo cat "$RUNNER_TEMP/openvpn.log" || true
          exit 1

      - name: Configure SSH host verification
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy static files
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p "$DEPLOY_SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$FRONTEND_REMOTE_DIR/dist'"
          # Keep older Vite hashes so open tabs can finish loading the build
          # they already received while index.html moves to the new release.
          rsync -az --delay-updates \
            -e "sshpass -e ssh -p $DEPLOY_SSH_PORT" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$FRONTEND_REMOTE_DIR/dist/"
          sshpass -e ssh -p "$DEPLOY_SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$FRONTEND_REMOTE_DIR/deploy'"
          rsync -az \
            -e "sshpass -e ssh -p $DEPLOY_SSH_PORT" \
            deploy/savegeo-apache.conf "$DEPLOY_USER@$DEPLOY_HOST:$FRONTEND_REMOTE_DIR/deploy/savegeo-apache.conf"
          rsync -az \
            -e "sshpass -e ssh -p $DEPLOY_SSH_PORT" \
            deploy/savegeo-nginx-timeouts.conf "$DEPLOY_USER@$DEPLOY_HOST:$FRONTEND_REMOTE_DIR/deploy/savegeo-nginx-timeouts.conf"
          sshpass -e ssh -p "$DEPLOY_SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail
            sudo install -m 0644 \
              '$FRONTEND_REMOTE_DIR/deploy/savegeo-apache.conf' \
              '$FRONTEND_APACHE_SITE_PATH'
            sudo apache2ctl configtest
            sudo systemctl reload apache2
            if command -v nginx >/dev/null 2>&1; then
              sudo install -m 0644 \
                '$FRONTEND_REMOTE_DIR/deploy/savegeo-nginx-timeouts.conf' \
                '$FRONTEND_NGINX_TIMEOUTS_PATH'
              sudo nginx -t
              sudo systemctl reload nginx
            fi
          "
          if [ -n "${FRONTEND_CURL_RESOLVE:-}" ]; then
            curl --fail --silent --show-error --resolve "$FRONTEND_CURL_RESOLVE" "$FRONTEND_HEALTH_URL" >/dev/null
          else
            curl --fail --silent --show-error "$FRONTEND_HEALTH_URL" >/dev/null
          fi

      - name: Record production deployment
        run: |
          node scripts/write-deployment-record.mjs dist/build-metadata.json frontend-production-deployment-record.json production
          {
            printf '### Verified frontend production deployment\n\n```json\n'
            cat frontend-production-deployment-record.json
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production deployment record
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: savegeo-frontend-production-deployment-record
          path: frontend-production-deployment-record.json
          if-no-files-found: error
          retention-days: 7

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree for secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
        run: |
          set -euo pipefail
          pulled=false
          for attempt in 1 2 3 4 5; do
            if docker pull "$GITLEAKS_IMAGE"; then
              pulled=true
              break
            fi
            echo "Gitleaks image pull failed (attempt $attempt/5); retrying..." >&2
            sleep $((attempt * 10))
          done
          if [ "$pulled" != true ]; then
            echo "Unable to pull $GITLEAKS_IMAGE after 5 attempts." >&2
            exit 1
          fi
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            "$GITLEAKS_IMAGE" detect \
            --source /repo \
            --no-git \
            --redact \
            --exit-code 1
