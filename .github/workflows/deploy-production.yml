name: Build and deploy SAVEGEO frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs that need more declare it explicitly.
permissions:
  contents: read

concurrency:
  group: savegeo-frontend-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      build_artifact_outcome: ${{ steps.build_artifact.outcome }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install, lint, test, audit, and build
        env:
          VITE_API_BASE_URL: /api
          VITE_APP_ENV: production
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          SAVEGEO_DEPLOYMENT_ENVIRONMENT: production
        run: |
          npm ci
          npm run lint
          npm test
          npm audit --audit-level=high
          npm run build
          node scripts/validate-build-metadata.mjs dist/build-metadata.json --expected-environment production

      - name: Upload production build
        id: build_artifact
        if: vars.SAVEGEO_UPLOAD_ARTIFACTS == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: savegeo-frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [validate, gitleaks]
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      FRONTEND_REMOTE_DIR: ${{ secrets.FRONTEND_REMOTE_DIR }}
      FRONTEND_APACHE_SITE_PATH: ${{ secrets.FRONTEND_APACHE_SITE_PATH }}
      FRONTEND_NGINX_TIMEOUTS_PATH: ${{ secrets.FRONTEND_NGINX_TIMEOUTS_PATH }}
      FRONTEND_HEALTH_URL: ${{ secrets.FRONTEND_HEALTH_URL }}
      FRONTEND_CURL_RESOLVE: ${{ secrets.FRONTEND_CURL_RESOLVE }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js for artifact validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Download production build
        if: needs.validate.outputs.build_artifact_outcome == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: savegeo-frontend-dist
          path: dist/

      - name: Rebuild validated source when no artifact is available
        if: needs.validate.outputs.build_artifact_outcome != 'success'
        env:
          VITE_API_BASE_URL: /api
          VITE_APP_ENV: production
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          SAVEGEO_DEPLOYMENT_ENVIRONMENT: production
        run: |
          echo 'Rebuilding this validated commit with the lockfile and production configuration.'
          npm ci
          npm run build

      - name: Validate deployed artifact provenance
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/validate-build-metadata.mjs dist/build-metadata.json --expected-sha "$GITHUB_SHA" --expected-environment production

      - name: Install VPN and deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn rsync netcat-openbsd

      - name: Connect VPN
        env:
          VPN_CONFIG_B64: ${{ secrets.VPN_CONFIG_B64 }}
          VPN_AUTH_B64: ${{ secrets.VPN_AUTH_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$VPN_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/client.ovpn"
          printf '%s' "$VPN_AUTH_B64" | base64 --decode > "$RUNNER_TEMP/vpn-auth.txt"
          chmod 600 "$RUNNER_TEMP/client.ovpn" "$RUNNER_TEMP/vpn-auth.txt"
          sudo openvpn --config "$RUNNER_TEMP/client.ovpn" \
            --auth-user-pass "$RUNNER_TEMP/vpn-auth.txt" \
            --daemon --log "$RUNNER_TEMP/openvpn.log"
          for i in $(seq 1 30); do
            nc -z -w 3 "$DEPLOY_HOST" "$DEPLOY_SSH_PORT" && exit 0
            sleep 3
          done
          sudo cat "$RUNNER_TEMP/openvpn.log" || true
          exit 1

      - name: Configure SSH host verification
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Deploy static files
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$FRONTEND_REMOTE_DIR/dist'"
          # Keep older Vite hashes so open tabs can finish loading the build
          # they already received while index.html moves to the new release.
          rsync -az --delay-updates \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p $DEPLOY_SSH_PORT" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$FRONTEND_REMOTE_DIR/dist/"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$FRONTEND_REMOTE_DIR/deploy'"
          rsync -az \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p $DEPLOY_SSH_PORT" \
            deploy/savegeo-apache.conf "$DEPLOY_USER@$DEPLOY_HOST:$FRONTEND_REMOTE_DIR/deploy/savegeo-apache.conf"
          rsync -az \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p $DEPLOY_SSH_PORT" \
            deploy/savegeo-nginx-timeouts.conf "$DEPLOY_USER@$DEPLOY_HOST:$FRONTEND_REMOTE_DIR/deploy/savegeo-nginx-timeouts.conf"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail
            sudo install -m 0644 \
              '$FRONTEND_REMOTE_DIR/deploy/savegeo-apache.conf' \
              '$FRONTEND_APACHE_SITE_PATH'
            sudo apache2ctl configtest
            sudo systemctl reload apache2
            if command -v nginx >/dev/null 2>&1; then
              sudo install -m 0644 \
                '$FRONTEND_REMOTE_DIR/deploy/savegeo-nginx-timeouts.conf' \
                '$FRONTEND_NGINX_TIMEOUTS_PATH'
              sudo nginx -t
              sudo systemctl reload nginx
            fi
          "
          if [ -n "${FRONTEND_CURL_RESOLVE:-}" ]; then
            curl --fail --silent --show-error --resolve "$FRONTEND_CURL_RESOLVE" "$FRONTEND_HEALTH_URL" >/dev/null
          else
            health_resolve="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          url = urlparse(os.environ["FRONTEND_HEALTH_URL"])
          port = url.port or (443 if url.scheme == "https" else 80)
          print(f"{url.hostname}:{port}:{os.environ['DEPLOY_HOST']}")
          PY
          )"
            # The private origin presents a self-signed cert; the request is
            # pinned to DEPLOY_HOST and travels through the authenticated VPN.
            curl --fail --silent --show-error --insecure --resolve "$health_resolve" "$FRONTEND_HEALTH_URL" >/dev/null
          fi

      - name: Record production deployment
        run: |
          node scripts/write-deployment-record.mjs dist/build-metadata.json frontend-production-deployment-record.json production
          {
            printf '### Verified frontend production deployment\n\n```json\n'
            cat frontend-production-deployment-record.json
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production deployment record
        if: vars.SAVEGEO_UPLOAD_ARTIFACTS == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: savegeo-frontend-production-deployment-record
          path: frontend-production-deployment-record.json
          if-no-files-found: error
          retention-days: 7

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          set -euo pipefail
          pulled=false
          for attempt in 1 2 3 4 5; do
            if docker pull "$GITLEAKS_IMAGE"; then
              pulled=true
              break
            fi
            echo "Gitleaks image pull failed (attempt $attempt/5); retrying..." >&2
            sleep $((attempt * 10))
          done
          if [ "$pulled" != true ]; then
            echo "Unable to pull $GITLEAKS_IMAGE after 5 attempts." >&2
            exit 1
          fi
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            "$GITLEAKS_IMAGE" detect \
            --source /repo \
            --redact \
            --exit-code 1
